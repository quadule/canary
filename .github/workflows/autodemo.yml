# Autodemo — when the `autodemo` label is applied to a PR, a canary-verify agent
# records a browser demo of the change, the workflow finalizes it as a cinematic
# video, and posts the report + video back to the PR as downloadable artifacts.
#
# STATUS: unverified until the first real `autodemo` run — a GitHub Actions
# workflow can't be smoke-tested locally. The PR-body parsing it relies on IS
# unit-tested (apps/canary/src/ci/autodemo.test.ts).
#
# REQUIRED REPO SECRETS:
#   ANTHROPIC_API_KEY  — auth for the Claude Code agent + the `claude -p` narration
#   GEMINI_API_KEY     — (optional) richer TTS / title image / music; without it
#                        the demo still works via macOS-less local fallbacks
#                        (drawtext title, no music) — but note narration TTS needs
#                        EITHER macOS `say` OR GEMINI_API_KEY, and CI is Linux, so
#                        on CI GEMINI_API_KEY is effectively required for narration.
#
# PR-BODY CONVENTIONS (see apps/canary/src/ci/autodemo.ts):
#   autodemo-url: https://staging.example.com/flow   ← REQUIRED target (no URL → no-op)
#   autodemo-theme: 1970s heist film, as a limerick  ← optional cinematic direction
#   "plain demo" / "no narration"                    ← opt out of the cinematic cut
#
# NOTE: GitHub has no public API to embed an inline/autoplaying video in a PR
# comment (that path is a browser-only user-attachments upload). So the video is
# attached as a downloadable run artifact and linked from a PR comment.

name: Autodemo

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: autodemo-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prepare:
    # Only on the `autodemo` label, and only for same-repo PRs — fork PRs get a
    # read-only token and no secrets, so they can neither run the agent nor comment.
    if: >-
      github.event.label.name == 'autodemo' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.cfg.outputs.run }}
      target: ${{ steps.cfg.outputs.target }}
      cinematic: ${{ steps.cfg.outputs.cinematic }}
      prompt: ${{ steps.cfg.outputs.prompt }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Parse the demo request from the PR body
        id: cfg
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          CFG=$(pnpm --filter @usecanary/cli exec tsx src/ci/autodemo.ts "${PR_BODY:-}")
          echo "Parsed autodemo config: $CFG"
          TARGET=$(echo "$CFG" | jq -r '.target // empty')
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "cinematic=$(echo "$CFG" | jq -r '.cinematic')" >> "$GITHUB_OUTPUT"
          echo "prompt=$(echo "$CFG" | jq -r '.prompt // empty')" >> "$GITHUB_OUTPUT"
          if [ -n "$TARGET" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi
      - name: Ask for a target when none was found
        if: steps.cfg.outputs.run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --body \
            "🎬 **autodemo**: I couldn't find a demo target. Add a URL to the PR description (e.g. \`autodemo-url: https://staging.example.com/flow\`), optionally \`autodemo-theme: <theme>\` or \`plain demo\`, then re-apply the **autodemo** label."

  demo:
    needs: prepare
    if: needs.prepare.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - run: pnpm build
      - name: Install ffmpeg and a font (title card / credits need drawtext + a font)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      # The browser comes from `canary install` below, which pins Chromium to the
      # embedded daemon's runtime Playwright version (@usecanary/protocol's
      # DAEMON_RUNTIME_DEPENDENCIES). We deliberately do NOT download it via the
      # daemon package here — that would tie the CI browser to the package's
      # dev-dep rather than the runtime pin. So this step installs only the apt
      # system libs Chromium links against; `canary install` is the single
      # source of the browser, and the ms-playwright cache holds the binary.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # Cache only the daemon's npm deps (~/.canary/node_modules) — NOT
      # ~/.canary/sessions, which a stale restore could feed to Finalize's
      # `session list | .[0]` fallback. `canary install` still runs and
      # reconciles, so a partial/stale cache is safe; this just skips the
      # npm install on a hit.
      - uses: actions/cache@v4
        with:
          path: ~/.canary/node_modules
          key: canary-runtime-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium system dependencies
        run: pnpm --filter @usecanary/daemon exec playwright install-deps chromium
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Put the canary CLIs on PATH
        # The root package is private with no `bin`, and nothing depends on
        # @usecanary/cli, so pnpm never links a `canary` into node_modules/.bin.
        # Symlink the built CLIs directly. (node resolves the symlink's realpath
        # for import.meta.url, so the bundled daemon assets still resolve.)
        run: |
          mkdir -p "$HOME/.local/bin" "$HOME/.canary"
          chmod +x "$GITHUB_WORKSPACE/apps/canary/dist/cli.js" "$GITHUB_WORKSPACE/apps/canary-browser/dist/cli.js"
          ln -sf "$GITHUB_WORKSPACE/apps/canary/dist/cli.js" "$HOME/.local/bin/canary"
          ln -sf "$GITHUB_WORKSPACE/apps/canary-browser/dist/cli.js" "$HOME/.local/bin/canary-browser"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Verify the canary CLIs are runnable
        # Fail fast and cheaply: if the CLI isn't on PATH the agent would
        # otherwise flail for minutes hitting permission walls (every fallback
        # `ls`/`cat`/`find` is denied by the `Bash(canary *)` allowlist, and in
        # headless `-p` mode a denial is returned to the model as a retryable
        # error). This step turns that whole failure class into a ~2s job failure
        # before the agent — and any API spend — starts.
        run: |
          canary --version
          canary-browser --help >/dev/null
      - name: Install the canary daemon runtime
        # Set up canary's embedded daemon NOW, in a free CI step — not lazily
        # inside the agent. Last run the agent's first `canary session start`
        # died with "Embedded daemon dependencies are missing. Run `canary
        # install`", then ran the ~150 MB download mid-turn (burning agent
        # wall-clock/tokens). This extracts the daemon bundle, npm-installs its
        # deps into ~/.canary/node_modules, and downloads the runtime-pinned
        # Chromium into ~/.cache/ms-playwright. Both are cached above; the apt
        # libs come from the install-deps step. Idempotent — a cache hit makes it
        # near-free, and it reconciles a stale cached node_modules (the
        # ~/.canary cache key tracks pnpm-lock, which a protocol-only version
        # bump doesn't change, so canary install is what actually upgrades it).
        run: canary install

      - name: Record the demo with the canary-verify agent
        # Hard wall-clock ceiling so a flailing agent can never run unbounded.
        # A normal recording is a few minutes; tune this down once we have a
        # baseline from a green run. This pairs with the --max-budget-usd cap
        # below: the dollar cap bounds cost, but denied-command flail is nearly
        # free and would loop a long time before it trips, so the timeout is the
        # reliable backstop on wall-clock.
        timeout-minutes: 12
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PR_BODY: ${{ github.event.pull_request.body }}
          TARGET: ${{ needs.prepare.outputs.target }}
        run: |
          set -euo pipefail
          # Resolve the target: remote/file URLs pass through; a repo-relative or
          # absolute path (e.g. a static demo.html checked into the PR) becomes a
          # file:// URL the browser can open. This is how a static local HTML demo
          # works — no server needed.
          case "$TARGET" in
            http://*|https://*|file://*) RESOLVED="$TARGET" ;;
            /*) RESOLVED="file://$TARGET" ;;
            *) RESOLVED="file://$GITHUB_WORKSPACE/$TARGET" ;;
          esac
          echo "Driving: $RESOLVED"
          # Build the agent prompt with printf (no heredoc — a heredoc's closing
          # delimiter can't be de-indented inside a YAML `run:` block). $PR_BODY is
          # interpolated as DATA: bash does not re-evaluate command substitutions
          # that live inside a variable's value, so a crafted PR body can't inject.
          PROMPT=$(printf '%s\n' \
            "Record a short browser demo of the user-facing flow in this pull request." \
            "Target URL: $RESOLVED" \
            "" \
            "PR description:" \
            "$PR_BODY" \
            "" \
            "Environment: this is a CI runner with NO display. Always pass --headless to" \
            "'canary session start'. Do NOT attempt xvfb, Xvfb, or DISPLAY= — they are" \
            "unavailable here and every such command will be denied. Do NOT pass --no-video;" \
            "the recorded video is required for the cinematic cut." \
            "" \
            "Steps:" \
            "1. Use the canary:session-agent subagent to record the flow — it already knows" \
            "   the Canary scripting API. Pass it the headless/no-xvfb constraints above." \
            "2. Drive the single most important user-facing flow this PR adds or modifies," \
            "   using humanClick/humanFill." \
            "3. Do NOT run 'canary session end' — leave the session open; CI finalizes it." \
            "4. Print the session id as: SESSION_ID=<id>")
          # The agent records the flow but does NOT end the session — the workflow
          # finalizes it below so the cinematic/theme decision stays in tested code.
          claude -p "$PROMPT" \
            --model claude-sonnet-4-6 \
            --effort low \
            --max-budget-usd 5 \
            --permission-mode acceptEdits \
            --allowedTools "Bash(canary *)" \
            --add-dir "$HOME/.canary" \
            --output-format stream-json \
            --verbose \
            --exclude-dynamic-system-prompt-sections \
            --plugin-dir "$GITHUB_WORKSPACE" \
            --append-system-prompt 'CI run: use the `canary` CLI directly (it is already on PATH) — never `npx @usecanary/cli` or any other npx form. The skill files mention `npx @usecanary/cli` because they target end-users; substitute `canary` for every such reference. This runner has NO display: always pass `--headless` to `canary session start`, and never attempt `xvfb`/`Xvfb`/`DISPLAY=` — those are unavailable and will be denied. Do not pass `--no-video`; the recorded video is required.' \
            2>&1 | tee agent.log | grep -v '"subtype":"thinking_tokens"'

      - name: Finalize the cinematic cut
        id: finalize
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CINEMATIC: ${{ needs.prepare.outputs.cinematic }}
          PROMPT: ${{ needs.prepare.outputs.prompt }}
        run: |
          set -euo pipefail
          # Prefer the id the agent printed; fall back to the newest session.
          SID=$(grep -oE 'SESSION_ID=[A-Za-z0-9._-]+' agent.log | tail -1 | cut -d= -f2 || true)
          if [ -z "${SID:-}" ]; then
            SID=$(canary session list --json | jq -r '.[0].id // .sessions[0].id // empty')
          fi
          if [ -z "${SID:-}" ]; then echo "No recorded session found"; exit 1; fi
          echo "Finalizing session $SID"
          FLAGS=()
          if [ "$CINEMATIC" = "true" ]; then
            FLAGS+=(--cinematic)
            if [ -n "${PROMPT:-}" ]; then FLAGS+=(--prompt "$PROMPT"); fi
          fi
          OUT=$(canary session end "$SID" "${FLAGS[@]}" --json)
          echo "$OUT"
          ARTIFACT_DIR=$(echo "$OUT" | jq -r '.artifactsDir')
          REPORT=$(echo "$OUT" | jq -r '.reportPath')
          # The run verdict (agent-declared via --pass/--fail, else the
          # any-step-failed fallback). Captured now so the job can be failed
          # AFTER the report/video have been uploaded (see the final gate step).
          STATUS=$(echo "$OUT" | jq -r '.status // "unknown"')
          echo "artifact_dir=$ARTIFACT_DIR" >> "$GITHUB_OUTPUT"
          echo "report=$REPORT" >> "$GITHUB_OUTPUT"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          # The cinematic cut is the (single) video in the session's video dir.
          VIDEO=$(find "$ARTIFACT_DIR" -name '*.webm' | head -1)
          echo "video=$VIDEO" >> "$GITHUB_OUTPUT"
          ( cd "$(dirname "$ARTIFACT_DIR")" && zip -r "$GITHUB_WORKSPACE/canary-report.zip" "$(basename "$ARTIFACT_DIR")" >/dev/null )
          cp "$VIDEO" "$GITHUB_WORKSPACE/canary-demo.webm" || true

      - name: Upload the report bundle
        uses: actions/upload-artifact@v4
        with:
          name: canary-report
          path: canary-report.zip
          if-no-files-found: error

      - name: Upload the cinematic video
        uses: actions/upload-artifact@v4
        with:
          name: canary-demo-video
          path: canary-demo.webm
          if-no-files-found: warn

      - name: Comment the demo on the PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh pr comment "${{ github.event.pull_request.number }}" --body \
            "🎬 **autodemo** is ready. The cinematic video and the full HTML report are attached to [this run]($RUN_URL#artifacts) — download **canary-demo-video** for the .webm, or **canary-report** for the trace/video/HAR/report bundle. (GitHub has no API to embed video inline; drag the .webm into a comment to play it here.)"

      # Fail the job when the QA session's verdict was a failure — but only after
      # the report + video are uploaded and the PR comment is posted above, so the
      # evidence is preserved for triage. Runs regardless of earlier step outcomes.
      - name: Gate the build on the session verdict
        if: always() && steps.finalize.outputs.status == 'failed'
        run: |
          echo "::error::Canary QA session verdict: FAILED — see the uploaded report."
          exit 1
